name: release

on:
  workflow_dispatch:
    inputs:
      sdk_archive_url:
        description: Exact immutable soksak-sdk archive URL from the release train
        required: true
        type: string
      sdk_archive_sha256:
        description: SHA-256 of the exact soksak-sdk archive
        required: true
        type: string
      sdk_release_url:
        description: Exact immutable soksak-sdk release.json URL
        required: true
        type: string
      sdk_release_sha256:
        description: SHA-256 of the exact soksak-sdk release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Read Rust toolchain
        id: rust-toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go/platformspec/go.mod
          cache-dependency-path: go/platformspec/go.sum
      - name: Materialize the exact Component Tooling release
        shell: bash
        run: |
          case "${{ inputs.sdk_archive_url }}" in
            https://github.com/soksak-ai/soksak-sdk/releases/download/v*/soksak-sdk-*-any.tgz) ;;
            *) echo "sdk_archive_url is not an immutable SDK release asset" >&2; exit 1 ;;
          esac
          case "${{ inputs.sdk_release_url }}" in
            https://github.com/soksak-ai/soksak-sdk/releases/download/v*/release.json) ;;
            *) echo "sdk_release_url is not an immutable SDK release document" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/soksak-sdk"
          curl -fsSL "${{ inputs.sdk_archive_url }}" -o "$RUNNER_TEMP/soksak-sdk.tgz"
          curl -fsSL "${{ inputs.sdk_release_url }}" -o "$RUNNER_TEMP/soksak-sdk-release.json"
          archive_sha="$(sha256sum "$RUNNER_TEMP/soksak-sdk.tgz" | awk '{print $1}')"
          release_sha="$(sha256sum "$RUNNER_TEMP/soksak-sdk-release.json" | awk '{print $1}')"
          test "$archive_sha" = "${{ inputs.sdk_archive_sha256 }}"
          test "$release_sha" = "${{ inputs.sdk_release_sha256 }}"
          declared_archive_sha="$(node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1]));process.stdout.write(r.artifacts[0].sha256)' "$RUNNER_TEMP/soksak-sdk-release.json")"
          test "$declared_archive_sha" = "$archive_sha"
          tar -xzf "$RUNNER_TEMP/soksak-sdk.tgz" -C "$RUNNER_TEMP/soksak-sdk" --strip-components=1
          test -z "$(find "$RUNNER_TEMP/soksak-sdk" -type l -print -quit)"
          node "$RUNNER_TEMP/soksak-sdk/bin/soksak-sdk.mjs" prepare
      - name: Prove and attest the complete release from the clean checkout
        run: make attest SDK_ROOT="$RUNNER_TEMP/soksak-sdk" SDK_RELEASE="$RUNNER_TEMP/soksak-sdk-release.json"
      - name: Bind publication to main and the exact checkout
        run: node scripts/release-context.mjs
      - name: Mint a least-privilege installation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: soksak-spec
          permission-administration: read
          permission-contents: write
      - name: Publish the verified owner manifest and assets
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: >-
          node scripts/publish-release.mjs
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --artifacts "$GITHUB_WORKSPACE/artifacts"
          --manifest "$GITHUB_WORKSPACE/artifacts/release.json"
