name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read build versions from Makefile
        id: build-versions
        shell: bash
        run: |
          echo "node=$(make --no-print-directory -s print-node-version)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(make --no-print-directory -s print-pnpm-version)" >> "$GITHUB_OUTPUT"
          echo "rust=$(make --no-print-directory -s print-rust-version)" >> "$GITHUB_OUTPUT"
          echo "go=$(make --no-print-directory -s print-go-version)" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ steps.build-versions.outputs.pnpm }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.build-versions.outputs.node }}
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.build-versions.outputs.rust }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.build-versions.outputs.go }}
          cache-dependency-path: go/platformspec/go.sum
      - name: Prove the complete release from the clean checkout
        run: make verify
      - name: Bind publication to main and the exact checkout
        run: node scripts/release-context.mjs
      - name: Mint a least-privilege installation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: soksak-spec
          permission-administration: read
          permission-contents: write
      - name: Publish the verified owner manifest and assets
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: >-
          node scripts/publish-release.mjs
          --repository "$GITHUB_REPOSITORY"
          --commit "$GITHUB_SHA"
          --artifacts "$GITHUB_WORKSPACE/artifacts"
          --manifest "$GITHUB_WORKSPACE/artifacts/soksak-spec-release.json"
