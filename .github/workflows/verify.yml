name: verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: build-versions
        shell: bash
        run: |
          echo "node=$(make --no-print-directory -s print-node-version)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(make --no-print-directory -s print-pnpm-version)" >> "$GITHUB_OUTPUT"
          echo "rust=$(make --no-print-directory -s print-rust-version)" >> "$GITHUB_OUTPUT"
          echo "go=$(make --no-print-directory -s print-go-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ steps.build-versions.outputs.pnpm }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.build-versions.outputs.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ steps.build-versions.outputs.rust }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ steps.build-versions.outputs.go }}
          cache-dependency-path: go/platformspec/go.sum
      - run: make verify
